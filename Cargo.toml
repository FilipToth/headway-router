[workspace]
members = ["crates/headway-core", "crates/headway-web"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
headway-core = { path = "crates/headway-core" }

# wasm payloads benefit far more from size than from the last few % of speed
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
